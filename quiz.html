<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Câu hỏi ôn tập</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--card:#151b2e;--text:#eef2ff;--muted:#9aa6c2;--accent:#7c6cf0;--green:#2dd4a8;--red:#f07178;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:1.7rem;margin:8px 0 6px}
.sub{color:var(--muted);margin-bottom:22px;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.qnum{color:var(--accent);font-weight:700;font-size:.85rem;margin-bottom:8px}
.qtext{font-size:1.15rem;line-height:1.65;margin-bottom:18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#101628;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;cursor:pointer;font:inherit;line-height:1.5}
.opt:hover{border-color:var(--accent)}
.opt .k{min-width:28px;height:28px;border-radius:8px;background:rgba(124,108,240,.2);display:flex;align-items:center;justify-content:center;font-weight:700}
.opt.ok{border-color:var(--green);background:rgba(45,212,168,.12)}
.opt.bad{border-color:var(--red);background:rgba(240,113,120,.12)}
.explain{margin-top:16px;padding:14px 16px;border-radius:12px;background:#101628;border-left:4px solid var(--accent);color:var(--muted);line-height:1.7;display:none}
.explain.show{display:block}
.explain b{color:var(--text)}
.bar{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
button.nav{background:var(--accent);border:0;color:#fff;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.nav:disabled{opacity:.4}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.score{margin-top:10px;color:var(--muted)}
.links{margin-top:18px;color:var(--muted);font-size:.9rem}
.links a{color:#cfc6ff}
</style>
</head>
<body>
<div class="wrap">
<p class="qnum">ÔN TẬP</p>
<h1>Câu hỏi trắc nghiệm</h1>
<p class="sub">Bấm A B C D. Sau khi chọn sẽ hiện đáp án và giải thích ngay câu đó.</p>
<div class="card">
<div class="qnum" id="num"></div>
<div class="qtext" id="q"></div>
<div class="opts" id="opts"></div>
<div class="explain" id="ex"></div>
<div class="bar">
<button class="nav ghost" id="prev" type="button">Câu trước</button>
<button class="nav" id="next" type="button">Câu tiếp</button>
</div>
<div class="score" id="score"></div>
</div>
<p class="links"><a href="./index.html">Insertion</a> · <a href="https://phiphakone.github.io/2/">Interchange</a> · <a href="https://phiphakone.github.io/3/">Selection</a> · <a href="https://phiphakone.github.io/4/">Bubble</a></p>
</div>
<script>
const Q=[
{q:"Insertion Sort giống việc nào nhất?",a:["Chọn người thấp nhất đưa lên đầu hàng","Sắp bài trên tay, chèn lá bài vào đúng chỗ","Đổi chỗ ngay mỗi khi thấy hai số đứng sai","Đẩy số lớn về cuối như bọt khí"],c:1,e:"Insertion Sort giống sắp bài: lấy key rồi chèn vào dãy đã sắp."},
{q:"Selection Sort đổi chỗ tối đa bao nhiêu lần?",a:["n × n lần","n / 2 lần","n − 1 lần","Chỉ 1 lần"],c:2,e:"Mỗi vòng chỉ đổi 1 lần. Có n − 1 vòng nên tối đa n − 1 lần đổi chỗ."},
{q:"Điểm khác nhau chính giữa Interchange Sort và Selection Sort?",a:["Interchange đổi chỗ ngay khi sai; Selection tìm min rồi mới đổi một lần","Interchange Sort nhanh hơn O(n)","Selection Sort không cần so sánh","Cả hai đều dừng sớm khi mảng đã sắp"],c:0,e:"Interchange đổi ngay khi a[i] > a[j]. Selection tìm min xong mới đổi 1 lần."},
{q:"Cờ swapped trong Bubble Sort dùng để làm gì?",a:["Đếm số phần tử","Lưu giá trị lớn nhất","Nếu một vòng không đổi chỗ thì dừng sớm","Đổi chỗ hai phần tử"],c:2,e:"Đặt swapped = false ở đầu vòng. Nếu hết vòng vẫn false thì mảng đã sắp, dùng break."},
{q:"O(n²) nghĩa là gì?",a:["Thời gian tăng gần đúng bằng số phần tử n","Số bước khoảng n nhân n, chậm khi n lớn","Thuật toán luôn sai","Chỉ dùng cho mảng đã sắp"],c:1,e:"Chữ O đọc ô. O(n²) = số bước ≈ n × n. Ví dụ n = 100 → khoảng 10.000 bước."},
{q:"Trường hợp tốt nhất của Insertion Sort và Bubble Sort (có tối ưu) là gì?",a:["O(n²)","O(n log n)","O(1)","O(n)"],c:3,e:"Mảng đã sắp: Insertion không chạy while; Bubble dừng nhờ swapped → O(n)."},
{q:"Thuật toán nào ổn định (stable)?",a:["Selection Sort và Interchange Sort","Insertion Sort và Bubble Sort","Chỉ Selection Sort","Không thuật toán nào ổn định"],c:1,e:"Ổn định = giữ thứ tự các phần tử bằng nhau. Insertion và Bubble ổn định."},
{q:"Mảng nào bắt buộc phải đã sắp trước khi tìm?",a:["Tìm kiếm tuần tự","Bubble Sort","Tìm kiếm nhị phân","Interchange Sort"],c:2,e:"Tìm nhị phân cắt nửa mảng nên mảng phải tăng dần sẵn. Tìm tuần tự không cần sắp."},
{q:"Trong tìm kiếm nhị phân, nếu x > a[m] thì làm gì?",a:["R = m − 1 — bỏ nửa phải","L = m + 1 — bỏ nửa trái, tìm bên phải","return -1 ngay","i = i + 1"],c:1,e:"x lớn hơn phần tử giữa nghĩa là x nằm bên phải, nên gán L = m + 1."},
{q:"Tìm kiếm tuần tự trả về -1 khi nào?",a:["Khi tìm thấy x ở đầu mảng","Khi x == a[i]","Khi đã duyệt hết mảng mà không thấy x","Khi mảng đã sắp"],c:2,e:"Duyệt từ i = 0 đến hết. Không thấy thì return -1."},
{q:"Biến temp trong C++ dùng để làm gì?",a:["Đếm số vòng lặp","Lưu tạm một giá trị để đổi chỗ hai phần tử","Kiểm tra mảng đã sắp chưa","Tính vị trí giữa"],c:1,e:"Đổi chỗ: temp = a[i]; a[i] = a[j]; a[j] = temp;"},
{q:"Nên dùng thuật toán nào khi dữ liệu rất lớn?",a:["Bubble Sort","Selection Sort","Interchange Sort","Không nên dùng 4 thuật toán O(n²) này"],c:3,e:"Cả 4 thuật toán đều O(n²) khi n lớn. Dùng để học. Dữ liệu lớn cần thuật toán nhanh hơn."}
];
let i=0,picked=Array(Q.length).fill(null),score=0;
const num=document.getElementById('num'),q=document.getElementById('q'),opts=document.getElementById('opts');
const ex=document.getElementById('ex'),prev=document.getElementById('prev'),next=document.getElementById('next'),sc=document.getElementById('score');
function render(){
const t=Q[i];
num.textContent='CÂU '+(i+1)+' / '+Q.length;
q.textContent=t.q;
opts.innerHTML='';
t.a.forEach(function(txt,k){
const b=document.createElement('button');
b.className='opt'; b.type='button';
b.innerHTML='<span class="k">'+'ABCD'.charAt(k)+'</span><span>'+txt+'</span>';
if(picked[i]!==null){
b.disabled=true;
if(k===t.c) b.classList.add('ok');
if(k===picked[i]&&k!==t.c) b.classList.add('bad');
} else b.onclick=function(){choose(k);};
opts.appendChild(b);
});
if(picked[i]!==null){
const ok=picked[i]===t.c;
ex.className='explain show';
ex.innerHTML='<b>'+(ok?'Đúng.':'Sai.')+' Đáp án: '+'ABCD'.charAt(t.c)+'</b><br>'+t.e;
} else { ex.className='explain'; ex.textContent=''; }
prev.disabled=i===0;
next.textContent=i===Q.length-1?'Xem điểm':'Câu tiếp';
const done=picked.filter(function(x){return x!==null;}).length;
sc.textContent=done?('Đã trả lời '+done+'/'+Q.length+' · Đúng '+score+' câu'):'Chưa chọn đáp án';
}
function choose(k){ if(picked[i]!==null) return; picked[i]=k; if(k===Q[i].c) score++; render(); }
prev.onclick=function(){ if(i>0){i--;render();} };
next.onclick=function(){
if(i<Q.length-1){i++;render();}
else { q.textContent='Bạn đúng '+score+' / '+Q.length+' câu.'; opts.innerHTML=''; ex.className='explain show'; ex.innerHTML='<b>Hết bài.</b> Bấm Câu trước để xem lại lời giải.'; next.disabled=true; sc.textContent='Điểm: '+score+' / '+Q.length; }
};
render();
</script>
</body></html>

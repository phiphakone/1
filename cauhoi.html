 document.getElementById('next').onclick=function(){if(i<Q.length-1){i++;render();}else{document.getElementById('q').textContent='Diem: '+score+' / '+Q.length;document.getElementById('opts').innerHTML='';document.getElementById('ex').style.display='block';document.getElementById('ex').textContent='Het bai.';}};render();
</script></body></html>
